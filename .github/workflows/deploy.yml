name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  # checks:
  #   uses: ./.github/workflows/pr-test.yml

  build:
    # needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}

      - name: Build и push image with two tags
        id: build-push
        env:
          IMAGE_SHA: ${{ secrets.DOCKER_USER }}/website-v1:sha-${{ github.sha }}
          IMAGE_LATEST: ${{ secrets.DOCKER_USER }}/website-v1:latest
        run: |
          docker build -t $IMAGE_SHA -t $IMAGE_LATEST .
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT

